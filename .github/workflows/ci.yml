name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Testcontainers starts Kafka and Postgres using the runner's Docker.
      - name: Integration tests
        run: go test -tags integration -count=1 ./...

  # Proves a fresh clone works: build every image, start everything, and
  # exercise it end to end through the public APIs.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the demo
        run: make demo

      - name: Smoke test
        run: make smoke

      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --tail=60 api processor query worker temporal migrate kafka-init

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: false
          push: false
