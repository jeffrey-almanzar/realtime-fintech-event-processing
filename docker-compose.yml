name: fintech

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft cluster (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for other containers, EXTERNAL for apps on the host
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in transactions transactions.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    # Tuned for write-heavy load (see docs/performance.md). Durability is
    # unchanged: synchronous_commit stays on.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://fintech:fintech@postgres:5432/fintech?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Single-process development server, with its web UI on port 8233.
  temporal:
    image: temporalio/temporal:1.8.3
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # The platform's own services. `make demo` starts these too; for development,
  # `make up` leaves them out so they can run from source with `make run-*`.
  api:
    profiles: [app]
    build: &app-build
      context: .
      args:
        SERVICE: api
    restart: on-failure
    environment: &app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgres://fintech:fintech@postgres:5432/fintech?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8081:8081"
    depends_on: &app-deps
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  processor:
    profiles: [app]
    build:
      <<: *app-build
      args:
        SERVICE: processor
    restart: on-failure
    environment: *app-env
    depends_on: *app-deps

  query:
    profiles: [app]
    build:
      <<: *app-build
      args:
        SERVICE: query
    restart: on-failure
    environment: *app-env
    ports:
      - "8082:8082"
    depends_on: *app-deps

  worker:
    profiles: [app]
    build:
      <<: *app-build
      args:
        SERVICE: worker
    restart: on-failure # also covers Temporal still starting up
    environment: *app-env
    depends_on:
      <<: *app-deps
      temporal:
        condition: service_started

  # On demand: `make demo-load`.
  loadgen:
    profiles: [tools]
    build:
      <<: *app-build
      args:
        SERVICE: loadgen
    environment: *app-env
    command: ["-url", "http://api:8081/transactions", "-rate", "200", "-duration", "60s", "-debits"]

volumes:
  postgres-data:
