---
# Temporal workers and the outbox relay both handle running in several copies
# (the relay uses FOR UPDATE SKIP LOCKED), so this can scale too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fintech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fintech/worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: fintech-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fintech-db
                  key: DATABASE_URL
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
